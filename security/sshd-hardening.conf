# SSH Server Hardening Configuration for Nyx
# Install to: /etc/ssh/sshd_config.d/99-hardening.conf
#
# Apply: sudo systemctl restart sshd
# Test first: sudo sshd -t
#
# IMPORTANT: Ensure you have key-based access before applying!
# This configuration will DISABLE password authentication.

# ============================================
# Authentication
# ============================================

# Disable password authentication (keys only)
PasswordAuthentication no
PermitEmptyPasswords no

# Disable root login
PermitRootLogin no

# Only allow specific user
AllowUsers fx

# Use public key authentication
PubkeyAuthentication yes

# Disable challenge-response
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no

# ============================================
# Security
# ============================================

# Maximum authentication attempts
MaxAuthTries 3

# Maximum sessions
MaxSessions 3

# Timeout settings
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# Disable unused authentication methods
HostbasedAuthentication no
IgnoreRhosts yes

# Strict mode
StrictModes yes

# ============================================
# Features to disable
# ============================================

# Disable X11 forwarding
X11Forwarding no

# Disable TCP forwarding (enable if needed for tunnels)
AllowTcpForwarding no
AllowStreamLocalForwarding no
GatewayPorts no

# Disable agent forwarding
AllowAgentForwarding no

# Disable tunneling
PermitTunnel no

# ============================================
# Logging
# ============================================

# Log level (increase for debugging)
LogLevel VERBOSE

# ============================================
# Cryptography (modern ciphers only)
# ============================================

# Strong ciphers only
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com

# Strong MACs only
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# Strong key exchange
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org

# ============================================
# Misc
# ============================================

# Show banner (optional - create /etc/ssh/banner if enabled)
# Banner /etc/ssh/banner

# Disable compression (security vs performance)
Compression no

# Use DNS for better logging (can be 'no' if slow)
UseDNS yes
